version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    assignees:
      - "foukm"
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    assignees:
      - "foukm"
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"
